# WordPress + WooCommerce local pour le front Maktaba El Hikma
#   docker compose up -d        → http://localhost:8080 (admin : /wp-admin)
#   ./setup.sh                  → installe WP, les extensions et les catégories
name: maktaba-wp

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('JWT_AUTH_SECRET_KEY', 'maktaba-local-dev-secret-change-me');
        define('JWT_AUTH_CORS_ENABLE', true);
        define('FS_METHOD', 'direct');
    volumes:
      - wp_data:/var/www/html
      - ../mu-plugins:/var/www/html/wp-content/mu-plugins

  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - ../mu-plugins:/var/www/html/wp-content/mu-plugins

volumes:
  db_data:
  wp_data:
